# Example strig config. Copy to $XDG_CONFIG_HOME/strig/config.yml
# (default ~/.config/strig/config.yml), or pass --config <path>.
# See docs/config.md for every key.

# Optional colour theme: a bundled name (strig --list-themes) or the path of a
# Base16/Base24 scheme file. See docs/themes.md.
# theme: tokyo-night

# Optional deadlines for GitHub calls, as Go durations (10s, 1m, 1m30s). Either
# key may be left out and keeps its default.
# timeouts:
#   request: 10s   # small calls and every write
#   load: 30s      # diff, pull request details, threads, PR lists

# Optional yes/no options (also `:set` while strig runs). wrapscan and
# hlsearch default to true, wrap, hideviewed, hidereviewed, autoviewed,
# hideresolved, skipresolved and relativenumber to false.
# wrapscan: false
# hlsearch: false
# wrap: true   # wrap long diff lines onto the next rows instead of cutting them off
# hideviewed: true   # files marked viewed (v) leave the Files pane after a short fade
# hidereviewed: true   # hunks marked reviewed (m) leave the diff pane after a short fade
# autoviewed: true   # m on a file's last unreviewed hunk also marks the file viewed
# hideresolved: true   # resolved comment threads leave the diff pane
# skipresolved: true   # ) and ( jump over resolved comment threads
# relativenumber: true   # number diff rows by distance from the cursor, for 5j / 5k

tabs:
  # Your own PRs. With no "user" and no "sections" a tab gets the default
  # sections for the signed-in user.
  - name: Me

  # A teammate's tab: the same default sections, with their login in place of
  # you.
  - name: Alice
    user: alice

  # A tab with sections of your own. {user} is replaced by the tab's user
  # (@me when the tab has none).
  - name: Team
    user: bob
    sections:
      - name: Needs my review
        query: is:pr is:open review-requested:@me author:{user}
        limit: 50
      - name: Recently merged
        query: is:pr is:merged author:{user}
        limit: 10
        sort: created
        order: desc

# Command plugins: each becomes a command that runs your own program. Plugins
# are read only from this file. See docs/plugins.md.
# plugins:
#   - command: ask               # becomes :ask
#     on_run: [strig-ask]        # the program and its arguments
#     target: lines              # lines or pull-request
#     timeout: 120s              # optional, default 60s
