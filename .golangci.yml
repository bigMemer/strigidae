version: "2"

linters:
  enable:
    - bodyclose
    - depguard
    - errorlint
    - gocritic
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
    depguard:
      # Enforces the package dependency graph in CLAUDE.md ("Layout").
      rules:
        real-github-client:
          files:
            - "$all"
            - "!**/cmd/strig/**"
            - "!**/internal/github/network/**"
          deny:
            - pkg: github.com/MikePors/strigidae/internal/github/network
              desc: only cmd/strig constructs the real GitHub client; everything else uses the github.Client interface
        user-interface-shell-imports-no-views:
          files:
            - "**/internal/userinterface/*.go"
            - "**/internal/userinterface/keys/**"
            - "**/internal/userinterface/theme/**"
            - "**/internal/userinterface/terminaltext/**"
            - "**/internal/userinterface/components/**"
          deny:
            - pkg: github.com/MikePors/strigidae/internal/userinterface/views
              desc: the shell and shared UI packages never import views; a view opens another by building it and sending userinterface.PushMessage
        core-imports-no-user-interface:
          files:
            - "**/internal/github/**"
            - "**/internal/beefis/**"
            - "**/internal/analysis/**"
            - "**/internal/diff/**"
            - "**/internal/config/**"
            - "**/internal/options/**"
            - "**/internal/editor/**"
            - "**/internal/clipboard/**"
            - "**/internal/environment/**"
            - "**/internal/gitrepository/**"
            - "**/internal/logging/**"
            - "**/internal/version/**"
          deny:
            - pkg: github.com/MikePors/strigidae/internal/userinterface
              desc: non-UI packages must not depend on UI packages
        no-charm-v1:
          deny:
            - pkg: github.com/charmbracelet/bubbletea
              desc: use charm.land/bubbletea/v2
            - pkg: github.com/charmbracelet/bubbles
              desc: use charm.land/bubbles/v2
            - pkg: github.com/charmbracelet/lipgloss
              desc: use charm.land/lipgloss/v2
            - pkg: github.com/charmbracelet/glamour
              desc: use charm.land/glamour/v2

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/MikePors/strigidae
